name: Feature request
description: Propose a classifier, evaluation, Flask UI or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation plan
      description: Include held-out metrics, validation data and false-positive considerations for model changes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Data, privacy and security implications
